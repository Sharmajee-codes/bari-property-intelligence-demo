[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bari-property-intelligence-demo"
version = "0.1.0"
description = "Independent synthetic property intelligence technical demonstration"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "SQLAlchemy>=2.0.38,<2.1",
  "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "geoalchemy2>=0.17,<1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.8,<3", "tenacity>=9,<10",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "pip-licenses>=5,<6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL/PostGIS and runs Alembic migrations"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
