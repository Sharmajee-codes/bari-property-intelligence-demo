name: lint-and-postgis-tests
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: bari_test
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: ci_local_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U demo -d bari_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://demo:ci_local_only@localhost:5432/bari_test
      TEST_DATABASE_URL: postgresql+psycopg://demo:ci_local_only@localhost:5432/bari_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock
      - run: pip install --no-deps -e .
      - run: ruff check . && ruff format --check .
      - run: python -m pytest -q
      - run: python -m app.cli run-demo --days 14
      - run: python -m app.cli quality-report
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-validation-reports
          path: reports/
